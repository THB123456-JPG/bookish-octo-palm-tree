<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>机器人配置中心</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{color-scheme:light dark;--bg:var(--tg-theme-secondary-bg-color,#f2f2f7);--card:var(--tg-theme-bg-color,#fff);--ink:var(--tg-theme-text-color,#1d1d1f);--muted:var(--tg-theme-hint-color,#6e6e73);--accent:var(--tg-theme-button-color,#007aff);--button-ink:var(--tg-theme-button-text-color,#fff);--line:color-mix(in srgb,var(--ink) 10%,transparent)}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
header{position:sticky;top:0;z-index:2;background:var(--card);padding:calc(8px + var(--tg-content-safe-area-inset-top,0px)) 16px 8px;display:grid;grid-template-columns:64px minmax(0,1fr) 64px;align-items:center;border-bottom:1px solid var(--line)}
header h1{grid-column:2;grid-row:1;font-size:17px;font-weight:600;text-align:center;margin:0}
header #back{grid-column:1;grid-row:1;padding:8px 0;color:var(--accent);white-space:nowrap}
header #refresh{grid-column:3;grid-row:1;justify-self:end;width:44px;font-size:21px;padding:8px 0}
header .quiet{background:transparent;border:0}
button,input,select,textarea{font:inherit}

button:disabled{opacity:.55;cursor:wait}button:active:not(:disabled){opacity:.72;transform:scale(.98)}
button:focus-visible,input:focus,textarea:focus,select:focus{outline:2px solid var(--accent);outline-offset:2px}
.quiet{color:var(--ink);background:var(--bg);border:1px solid var(--line)}
.danger{color:#d33030;background:var(--card);border:1px solid var(--line)}
main{max-width:640px;margin:auto;padding:16px 16px calc(110px + env(safe-area-inset-bottom) + var(--tg-content-safe-area-inset-bottom,0px))}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px;overflow-wrap:anywhere}
h2{font-size:17px;font-weight:600;margin:0 0 10px}h3{font-size:15px;margin:18px 0 8px}p{margin:8px 0 12px}
.muted,small{color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.bot{display:flex;gap:12px;align-items:center;padding:14px 16px}.bot>div:last-child{min-width:0}.bot small{display:block;font-size:12px}
.avatar,.icon{display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 9%,var(--card));color:var(--accent);border-radius:12px;flex-shrink:0}
.avatar{width:42px;height:42px;font-size:24px}.icon{width:36px;height:36px;font-size:22px}
.expiry-dot{display:inline-block;width:6px;height:6px;margin-right:5px;border-radius:50%;background:#30a46c}.expiry-dot.expired{background:#d33030}
.overview-title,.overview-menu{font-size:13px;font-weight:500;color:var(--muted);margin:18px 4px 10px}
.overview-metrics{grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:0}.overview-metrics .metric{padding:4px;min-width:0;aspect-ratio:1;margin:0}.overview-metrics .compact-metric{aspect-ratio:auto;min-height:80px}
.metric b{display:block;font-size:24px;font-variant-numeric:tabular-nums}.metric-link{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;width:100%;height:100%;min-height:0;background:transparent;color:var(--ink);padding:0;text-align:center}
.metric-link b{color:#4e9be1}.metric-link small{font-size:11px;line-height:1.35;white-space:nowrap}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:16px 12px;background:var(--card);color:var(--ink);text-align:left;border-bottom:1px solid var(--line);border-radius:0}
.row:last-child{border-bottom:0}.row>span:nth-child(2){flex:1;min-width:0}.row strong{display:block}.row:active:not(:disabled){background:color-mix(in srgb,var(--accent) 7%,var(--card))}
.menu{padding:0;overflow:hidden}.overview-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;background:transparent;border:0;overflow:visible}
.overview-grid .row{display:flex;flex-direction:column;justify-content:center;gap:8px;min-height:128px;padding:16px 6px;text-align:center;border:1px solid var(--line);border-radius:16px}
.overview-grid .row>span:nth-child(2){flex:0;width:100%}.overview-grid .row>span:last-child{display:none}.overview-grid .row strong{font-size:14px;font-weight:600}.overview-grid .row small{display:block;font-size:11px;margin-top:3px}
.row[data-go=staff] .icon{color:#a76409;background:color-mix(in srgb,#a76409 9%,var(--card))}.row[data-go=features] .icon{color:#168653;background:color-mix(in srgb,#168653 9%,var(--card))}.row[data-go=ads] .icon{color:#8553cb;background:color-mix(in srgb,#8553cb 9%,var(--card))}.row[data-go=replies] .icon{color:#d64d76;background:color-mix(in srgb,#d64d76 9%,var(--card))}
label{display:block;margin:14px 0 6px}input:not([type=checkbox]),select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);padding:11px;min-width:0;min-height:44px}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:.8}textarea{min-height:112px;resize:vertical}input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px;padding:5px 0}.switch label{margin:0;flex:1;padding:8px 0;cursor:pointer}
.switch input{appearance:none;-webkit-appearance:none;width:36px;height:22px;flex:0 0 36px;background:var(--bg);border:1px solid var(--line);border-radius:22px;position:relative;cursor:pointer}
.switch input:before{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--muted);transition:transform .15s}.switch input:checked{background:var(--accent)}.switch input:checked:before{background:#fff;transform:translateX(14px)}
.actions{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:10px;margin-top:16px}.actions button{flex:1;min-width:0}.actions button[hidden]{display:none}
.search{display:flex;align-items:center;gap:8px;margin:0 0 14px}.search input{width:0;flex:1}.search button{flex-shrink:0;padding:10px 12px}
.record{padding:14px 0;border-bottom:1px solid var(--line)}.record:last-child{border:0}.record b{display:block}.empty{text-align:center;padding:24px 8px;color:var(--muted)}
.entry-heading{display:flex;align-items:baseline;justify-content:space-between;gap:8px}.entry-heading strong{font-size:17px;font-variant-numeric:tabular-nums;text-align:right}.entry-heading>span{font-size:13px}.record-meta{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 12px;margin-top:4px}.record-note{font-size:13px;margin-top:6px}.entry-record details{margin:8px 0 0;font-size:12px}.entry-record summary{font-size:12px;color:var(--muted)}
nav{position:fixed;z-index:3;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);padding:4px 6px calc(4px + env(safe-area-inset-bottom) + var(--tg-content-safe-area-inset-bottom,0px));display:flex;justify-content:center;gap:4px}
nav button{max-width:130px;flex:1;background:transparent;color:var(--muted);padding:2px 0;font-size:11px;min-height:44px}nav button span{display:block;font-size:20px;line-height:24px}nav button[aria-current=page]{color:var(--accent)}
#appFooter{grid-column:1/-1;text-align:center;font-size:11px;padding:2px 8px}#appFooter a{color:var(--accent);text-decoration:none}
#toast{pointer-events:none;position:fixed;bottom:calc(104px + env(safe-area-inset-bottom));left:16px;right:16px;max-width:608px;margin:auto;background:var(--ink);color:var(--card);border-radius:12px;padding:13px 16px;z-index:5;box-shadow:0 5px 25px #0002;text-align:center}
.wide{width:100%}.error{border-left:3px solid #d33030}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit;margin:8px 0}details{margin:14px 0}summary{cursor:pointer;color:var(--accent)}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.pills button{padding:8px 10px}
.feature-grid,.grant-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.feature-grid{grid-template-columns:1fr;gap:0}.feature-item{padding:8px 0;border-bottom:1px solid var(--line)}.feature-item:last-child{border:0}.feature-item label,.grant-grid label{font-size:14px;font-weight:500}.feature-item small{display:block;font-size:12px;line-height:1.5;margin:0 0 5px}.grant-grid .switch{gap:6px}.grant-grid>div{padding:10px;border:1px solid var(--line);border-radius:12px}.grant-grid small{display:block;font-size:12px;margin-top:4px}
.staff-summary{display:flex;justify-content:space-between;gap:8px;align-items:center}.staff-summary h2{margin:2px 0 4px}.owner-badge{padding:6px 8px;border-radius:8px;background:color-mix(in srgb,var(--accent) 8%,var(--card));font-size:12px;text-align:center;white-space:nowrap}.owner-badge b{color:var(--accent)}
.grant-note{background:var(--bg);padding:10px;border-radius:10px;font-size:12px}.targets{border:1px solid var(--line);border-radius:12px;margin:15px 0;padding:8px 12px;max-height:220px;overflow:auto}.targets label{margin:6px 0;font-size:13px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;min-height:44px;cursor:pointer}.targets input{flex-shrink:0}
.permission-tags{display:inline-flex;gap:5px;flex-wrap:wrap;margin-top:7px;vertical-align:middle}.tag{display:inline-flex;flex:0 0 auto;align-items:center;border-radius:5px;font-size:11px;line-height:18px;padding:2px 6px;white-space:nowrap}.tag-manage{color:#2364c8;background:color-mix(in srgb,#2364c8 10%,var(--card))}.tag-global{color:#168653;background:color-mix(in srgb,#168653 10%,var(--card))}.tag-single{color:#a86510;background:color-mix(in srgb,#a86510 10%,var(--card))}.tag-broadcast{color:#8553cb;background:color-mix(in srgb,#8553cb 10%,var(--card))}
.person-row{padding-left:0;padding-right:0}.person-row>span:first-child{display:block;width:100%;min-width:0}.user-meta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;margin-top:5px;font-size:12px}.user-meta .permission-tags{display:contents}
.bill-search{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;margin-bottom:12px}.bill-search label{display:none}.bill-search select{grid-column:1/-1}.bill-search button{padding:10px 16px}
.bill-kinds,.sort-pills,.period-pills{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}.bill-kinds,.sort-pills{padding:3px;border-radius:12px;background:var(--card);border:1px solid var(--line)}.bill-kinds button,.period-pills button,.sort-pills button{font-size:13px;white-space:nowrap;padding:8px 2px;border-radius:9px}.bill-kinds .quiet,.sort-pills .quiet{border:0;background:transparent}
.stats-controls{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px}.stats-controls>small{display:none}.sort-pills,.date-range,.period-pills{grid-column:1/-1;margin:0}.stats-scope label{display:none}.query-button{padding:10px 22px}.date-range{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:center}.date-range input{padding:8px 2px;font-size:13px;text-align:center;font-variant-numeric:tabular-nums}.date-range span{color:var(--muted);font-size:12px}.period-pills{margin-bottom:4px}
.summary-cards{gap:10px;margin:16px 0}.summary-cards .metric{padding:14px 8px;margin:0;text-align:center}.summary-cards b{font-size:23px;color:var(--ink);margin-top:4px}.summary-cards small{font-size:12px}.group-stats-heading{display:flex;justify-content:space-between;gap:8px;font-size:13px;margin:2px 0 8px}.stats-empty{padding:20px 0;text-align:center}
.sheet-heading{position:sticky;top:-16px;display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--card);z-index:1;padding:8px 0}.sheet-heading h2{margin:0}.sheet-heading button{flex-shrink:0}
dialog{border:0;background:var(--card);color:var(--ink);padding:16px;width:100%;max-width:640px;max-height:88dvh;position:fixed;top:auto;bottom:0;margin:0 auto;border-radius:20px 20px 0 0;overflow:auto;overscroll-behavior:contain}dialog::backdrop{background:#0006}dialog .wide{margin:12px 0 calc(5px + env(safe-area-inset-bottom))}body:has(dialog[open]){overflow:hidden}
.confirm-dialog{inset:0;margin:auto;max-width:min(360px,calc(100% - 32px));height:fit-content;border-radius:18px;padding:20px;text-align:center}.confirm-dialog p{color:var(--muted);margin:12px 0 20px}.confirm-dialog .actions{display:grid;grid-template-columns:1fr 1fr}.confirm-dialog .danger{background:#d33030;color:#fff;border:0}
.welcome-preview{display:block;width:100%;max-height:300px;object-fit:contain;border-radius:12px;background:var(--bg)}.tron-result{white-space:pre-wrap;overflow-wrap:anywhere;margin-top:16px}.tron-result pre{white-space:pre-wrap;font-size:12px}
@media(max-width:340px){main{padding-left:12px;padding-right:12px}.card{padding:12px}.menu{padding:0}.metric-link small{font-size:10px}.overview-metrics{gap:6px}.metric-link b{font-size:21px}.date-range{gap:4px}.date-range input{font-size:12px}.grant-grid>div{padding:8px}.grant-grid label{font-size:12px}}
@media(prefers-color-scheme:dark){:root{--bg:var(--tg-theme-secondary-bg-color,#000);--card:var(--tg-theme-bg-color,#1c1c1e);--ink:var(--tg-theme-text-color,#f5f5f7);--muted:var(--tg-theme-hint-color,#a1a1a6);--accent:var(--tg-theme-button-color,#0a84ff)}}
@media(prefers-reduced-motion:reduce){button,.switch input:before{transition:none}}
</style>
</head>
<body>
<header><button type="button" class="quiet" id="back" aria-label="返回" hidden>‹ 返回</button><h1 id="title">配置中心</h1><button class="quiet" id="refresh" aria-label="刷新数据">↻</button></header>
<main id="content" aria-live="polite"><div class="card empty">正在验证 Telegram 身份…</div></main>
<nav aria-label="主要导航" id="nav" hidden></nav>
<div id="toast" role="status" hidden></div>
<dialog id="editor" aria-labelledby="editorTitle"></dialog>
<dialog id="confirmation" class="confirm-dialog" aria-labelledby="confirmationTitle"><h2 id="confirmationTitle"></h2><p id="confirmationMessage"></p><div class="actions"><button type="button" class="quiet" id="confirmCancel">取消</button><button type="button" id="confirmAccept">确认</button></div></dialog>
<script>
'use strict';
const tg=window.Telegram?.WebApp;
tg?.ready();tg?.expand();
const $=s=>document.querySelector(s), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const bid=location.pathname.split('/').pop();
let data, view='overview', selectedGroup=null, filterKind='all';
let selectedUser=null,selectedBill=null,selectedBillGroup=null,billData=null,statData=null,statDetail=null,billGroup='',billSearch='',statsGroup='',statsSort='income',statsRange=null,queryBusy=false;
let busy=false,dirty=false,editorDirty=false,receivedAt=0,pageFormState='',editorFormState='',querySequence=0,rendering=false,queryController=null,pendingQuery='';
const trail=[],listSearch={};
const names={overview:'配置中心',users:'用户',groups:'群组',bills:'账单',stats:'统计',staff:'内部人员',shop:'商城配置',group:'群组配置',help:'使用说明',basics:'基础配置',features:'功能开关',ads:'定时广告',replies:'自动回复',user:'用户配置',bill:'账单明细',billgroup:'群组账单',statgroup:'群组统计',tron:'地址查询与密钥'};
const icons={overview:'▦',users:'♙',groups:'♧',bills:'▤',stats:'▥'};
function toast(s){$('#toast').textContent=s;$('#toast').hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('#toast').hidden=true,4500)}
async function api(action,payload={},signal){
 const controller=new AbortController(),abort=()=>controller.abort();let timedOut=false;
 signal?.addEventListener('abort',abort,{once:true});if(signal?.aborted)abort();
 const timer=setTimeout(()=>{timedOut=true;controller.abort()},30000);
 try{
  const response=await fetch(`/api/miniapp/${encodeURIComponent(bid)}/${action}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({init_data:tg?.initData||'',payload}),cache:'no-store',signal:controller.signal});
  const result=await response.json();if(!response.ok||!result.ok)throw Error(result.error||'请求失败，请稍后重试');return result.data;
 }catch(error){if(timedOut)throw Error('请求超时，请检查网络后重试');throw error}
 finally{clearTimeout(timer);signal?.removeEventListener('abort',abort)}
}

function formState(root){return JSON.stringify([...root.querySelectorAll('form:not(#tronQueryForm)')].map(f=>[...f.elements].filter(e=>e.name&&e.tagName!=='BUTTON').map(e=>[e.name,e.type==='checkbox'?e.checked:e.value])))}
function closingState(){if(dirty||editorDirty)tg?.enableClosingConfirmation();else tg?.disableClosingConfirmation();if(view!=='overview'||$('#editor').open||$('#confirmation').open)tg?.BackButton?.show();else tg?.BackButton?.hide?.()}
function confirmAction(message,{title='确认操作',accept='确认',danger=false}={}){const d=$('#confirmation');if(d.open)return Promise.resolve(false);$('#confirmationTitle').textContent=title;$('#confirmationMessage').textContent=message;$('#confirmAccept').textContent=accept;$('#confirmAccept').className=danger?'danger':'';d.showModal();closingState();return new Promise(resolve=>{const finish=value=>{d.close();closingState();resolve(value)};$('#confirmCancel').onclick=()=>finish(false);$('#confirmAccept').onclick=()=>finish(true);d.oncancel=e=>{e.preventDefault();finish(false)};d.onclick=e=>{if(e.target===d){const r=d.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)finish(false)}}})}
async function canLeave(){return !dirty||await confirmAction('修改尚未保存，离开后将丢失。',{title:'离开当前页面？',accept:'放弃修改',danger:true})}
async function closeEditor(){if(busy)return;if(editorDirty&&!await confirmAction('修改尚未保存，关闭后将丢失。',{title:'关闭编辑？',accept:'放弃修改',danger:true}))return;$('#editor').close()}
function footerClick(){const name=(data.footer_text||'').match(/@([a-zA-Z][a-zA-Z0-9_]{4,31})\b/);if(name)tg.openTelegramLink('https://t.me/'+name[1])}
function renderFooter(){
 $('#appFooter')?.remove();
 const footer=(data.footer_text??'联系开发者@HCW2026').slice(0,64),button=tg?.MainButton;
 $('#nav').style.display='flex';
 if(button?.setParams){
  button.offClick(footerClick);
  if(!footer){button.hide();return}
  const theme=getComputedStyle(document.documentElement);
  button.setParams({text:footer,color:theme.getPropertyValue('--card').trim(),text_color:theme.getPropertyValue('--accent').trim(),is_visible:true,is_active:true});
  button.onClick(footerClick);
 }else if(footer){
  $('#nav').style.display='grid';
  $('#nav').insertAdjacentHTML('beforeend',`<div id="appFooter">${esc(footer).replace(/@([a-zA-Z][a-zA-Z0-9_]{4,31})\b/g,'<a href="https://t.me/$1" target="_blank" rel="noopener noreferrer">@$1</a>')}</div>`);
 }
}
tg?.onEvent?.('themeChanged',()=>{if(data)renderFooter()});
function navViews(){return ['overview','users','groups','bills','stats']}
function configEditable(next,d=data){const p=d.permissions||{};return next==='staff'?d.is_owner:['basics','features'].includes(next)?p.manage:['ads','replies'].includes(next)?p.manage||p.broadcast:true}
function viewAllowed(next,d=data,selection={}){
 if(d.type==='shop')return !['staff','shop'].includes(next)||d.is_owner;
 if(['basics','features','staff','ads','replies'].includes(next))return true;
 const parent={user:'users',group:'groups',bill:'bills',billgroup:'bills',statgroup:'stats'}[next]||next;
 if(['users','groups','bills','stats'].includes(parent)&&!navViews(d).includes(parent))return false;
 if(next==='user')return d.permission_users.some(u=>u.user_id===(selection.user??selectedUser));
 if(next==='group')return d.groups.some(g=>g.chat_id===(selection.group??selectedGroup));
 return true;
}
function pageSnapshot(){return {view,selectedGroup,selectedUser,selectedBill,selectedBillGroup,filterKind,scroll:scrollY}}
async function go(next,selection={}){if(busy||next===view&&!Object.keys(selection).length)return;if(!viewAllowed(next,data,selection))return toast('你没有这项配置权限');if(!await canLeave())return;if(['overview','users','groups','bills','stats'].includes(next))trail.length=0;else trail.push(pageSnapshot());if(selection.group!==undefined)selectedGroup=selection.group;if(selection.user!==undefined)selectedUser=selection.user;if(selection.bill!==undefined)selectedBill=selection.bill;if(selection.billGroup!==undefined)selectedBillGroup=selection.billGroup;cancelQuery();dirty=false;view=next;render();window.scrollTo(0,0)}
async function goBack(){if($('#confirmation').open){$('#confirmCancel').click();return}if($('#editor').open){await closeEditor();return}if(busy||view==='overview'||!await canLeave())return;cancelQuery();const previous=trail.pop();dirty=false;if(previous){({view,selectedGroup,selectedUser,selectedBill,selectedBillGroup,filterKind}=previous)}else view='overview';render();requestAnimationFrame(()=>window.scrollTo(0,previous?.scroll||0))}
function card(body,cls=''){return `<section class="card ${cls}">${body}</section>`}
function empty(s){return `<div class="empty">${esc(s)}</div>`}
function svgIcon(key){const paths={basics:'M4 7h16M4 17h16M9 4v6M16 14v6',staff:'M15 20v-2a5 5 0 0 0-10 0v2M17 5a4 4 0 0 1 0 8M20 20v-2a4 4 0 0 0-3-4',features:'M5 5h14v5H5zM5 14h14v5H5zM8 7.5h3M8 16.5h3',ads:'M4 10h4l10-5v14l-10-5H4zM8 14l2 6M21 9v6',replies:'M4 4h16v12H10l-5 4v-4H4zM8 8h8M8 12h5'};return paths[key]?`<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="${paths[key]}"/>${key==='staff'?'<circle cx="10" cy="8" r="4"/>':''}</svg>`:''}
function row(name,description,target,icon){return `<button class="row" data-go="${target}"><span class="icon" aria-hidden="true">${svgIcon(target)||icon}</span><span><strong>${esc(name)}</strong><small>${esc(description)}</small></span><span aria-hidden="true">›</span></button>`}
function input(name,label,value,type='text',extra=''){return `<label for="${name}">${esc(label)}</label><input id="${name}" name="${name}" type="${type}" value="${esc(value)}" ${extra}>`}
function select(name,label,value,options){return `<label for="${name}">${esc(label)}</label><select id="${name}" name="${name}">${options.map(([v,l])=>`<option value="${esc(v)}" ${String(v)===String(value)?'selected':''}>${esc(l)}</option>`).join('')}</select>`}
function toggle(name,label,value){return `<div class="switch"><label for="${name}">${esc(label)}</label><input id="${name}" name="${name}" type="checkbox" ${value?'checked':''}></div>`}
function saveButton(){return '<div class="actions"><button type="submit">保存配置</button><button type="button" class="quiet" data-back>返回</button></div>'}
function search(){return '<div class="search"><input id="search" type="search" aria-label="搜索当前列表" placeholder="搜索名称、ID 或备注"><button class="quiet" id="searchBtn">搜索</button></div>'}
function remainingTime(seconds){
 if(seconds==null)return '未设置';
 if(seconds<=0)return '已到期';
 const minutes=Math.ceil(seconds/60),days=Math.floor(minutes/1440),hours=Math.floor(minutes%1440/60);
 return `${days}天 ${hours}小时 ${minutes%60}分钟`;
}
function updateRemaining(){
 const node=$('#remaining');if(!node||!data)return;
 const seconds=data.remaining_seconds==null?null:Math.max(0,data.remaining_seconds-Math.floor((performance.now()-receivedAt)/1000));
 node.textContent='剩余使用时间：'+remainingTime(seconds);
 const dot=$('.expiry-dot');if(dot)dot.classList.toggle('expired',seconds===0);
}
function overview(){
 const expiry=data.expire_at?new Date(data.expire_at*1000).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai',hour12:false}):'未设置';
 let html=card(`<div class="avatar" aria-hidden="true">🤖</div><div><strong>@${esc(data.username||data.id)}</strong><small><span class="expiry-dot" aria-hidden="true"></span>到期：${esc(expiry)}</small><small id="remaining"></small>${data.type==='ledger'?`<small id="accessScope">${data.is_owner?'拥有者 · 全部权限':esc([data.permissions.manage?'管理配置':'',data.permissions.global_ops?'全局操作':data.groups.length?`单群操作 · ${data.groups.length}群`:'',data.permissions.broadcast?'广播':''].filter(Boolean).join(' · ')||'功能预览 · 尚未授权')}</small>`:''}</div>`,'bot');
 html+='<h2 class="overview-title">运行概览</h2>';
 const metrics=data.type==='shop'?[['群组',data.groups.length],['最近收款',data.entries.length]]:[['记账群组',data.enabled_group_count],['权限成员',data.permission_users.length],['自动回复',data.enabled_reply_count||0],['定时消息',data.enabled_ad_count||0]].filter(([label])=>['自动回复','定时消息'].includes(label)?data.permissions.manage||data.permissions.broadcast:data.is_owner||data.groups.length);
 html+=`<div class="grid overview-metrics" style="grid-template-columns:repeat(${Math.max(1,metrics.length)},minmax(0,1fr))">${metrics.map(([label,count])=>card(`<button type="button" class="metric-link" data-go="${data.type==='shop'?(label==='群组'?'groups':'bills'):(label==='记账群组'?'groups':label==='权限成员'?'users':label==='自动回复'?'replies':'ads')}"><b>${count}</b><small>${esc(label)}</small></button>`,metrics.length<4?'metric compact-metric':'metric')).join('')}</div><h2 class="overview-menu">配置管理</h2>`;
 let menu='';if(data.type==='shop'){if(data.is_owner)menu=row('商城配置','收款、定价与商品','shop','⚡')+row('内部人员','管理全局操作人','staff','♙');menu+=row('使用说明','功能与配置流程','help','▤')}else{
 const p=data.permissions||{};
 menu+=row('基础配置','日切 · 账单 · 欢迎语','basics','⚙');
 menu+=row('内部人员','管理 · 操作 · 广播','staff','♙');
 menu+=row('功能开关','通知 · 账单 · 查询','features','▤');
 menu+=row('定时广告','定时 · 循环发送','ads','⚑')+row('自动回复','关键词 · 自动应答','replies','▱');

 menu+=row('地址查询与密钥','余额 · 交易 · API Key','tron','🔑');
 }html+=card(menu,data.type==='ledger'?'menu overview-grid':'menu');return html;
}
function tron(){
 const c=data.tron||{};
 return card(`<h2>TRX / USDT 地址查询</h2><form id="tronQueryForm">${input('tron_address','TRON／TRC20 地址','','text','required maxlength="34" autocomplete="off" placeholder="输入 T 开头的完整地址"')}<button class="wide" type="submit">查询余额与最近交易</button></form><div id="tronResult" class="tron-result" aria-live="polite"></div>`)
 +card(`<h2>查询 API Key</h2><p id="tronKeyStatus">${c.source==='custom'?`已绑定 ${c.custom_count} 把独立 Key。`:`使用平台默认 ${c.default_count||0} 把 Key 轮换查询。`}</p>${c.masked_keys?.length?`<p class="muted">${c.masked_keys.map(esc).join(' · ')}</p>`:''}<p class="muted">绑定免费 API Key，提高查询速度与稳定性。</p>${c.can_bind?`<form id="tronKeysForm"><label for="tron_keys">自己的 TronGrid API Key</label><textarea id="tron_keys" name="tron_keys" maxlength="1300" autocomplete="off" spellcheck="false" required placeholder="粘贴查询 API Key；最多5把，每行一把。保存时替换原独立绑定。"></textarea><button class="wide" type="submit">验证并绑定</button></form>${c.custom_count?'<button class="quiet wide" id="clearTronKeys" type="button">清除绑定，恢复平台默认</button>':''}`:'<p class="muted">仅机器人拥有者可绑定或清除 API Key。</p>'}`)
 +card('<details><summary>如何申请免费 API Key？</summary><ol><li>打开 <a href="https://www.trongrid.io/" target="_blank" rel="noopener noreferrer">TronGrid 官网</a>，注册并登录免费账户。</li><li>进入控制台的 API Keys 页面，点击创建 API Key，填写名称后保存。</li><li>复制创建的 API Key，粘贴到上面的输入框，点击「验证并绑定」。</li><li>验证通过后，本机器人查询和监听会使用你绑定的 Key；其他机器人的配置不受影响。</li></ol><p class="muted">这里只需要查询 API Key，请勿填写钱包私钥或助记词。免费额度和限流以 TronGrid 控制台为准。</p><a href="https://developers.tron.network/reference/select-network" target="_blank" rel="noopener noreferrer">查看官方申请说明</a></details>');
}
function bindTron(){
 const query=$('#tronQueryForm');if(query)query.onsubmit=async e=>{e.preventDefault();if(busy)return;const button=query.querySelector('button'),result=$('#tronResult');busy=true;button.disabled=true;result.textContent='正在查询，请稍候…';try{const response=await api('tronquery',{address:query.tron_address.value.trim()});result.innerHTML=response.html}catch(error){result.textContent=error.message}finally{busy=false;button.disabled=false}};
 const keys=$('#tronKeysForm');if(keys)keys.onsubmit=e=>{e.preventDefault();save('tronkeys',{keys:keys.tron_keys.value.trim().split(/\s+/).filter(Boolean)})};
 if($('#clearTronKeys'))$('#clearTronKeys').onclick=async()=>{if(await confirmAction('清除自己的 API Key 后，将恢复平台默认密钥轮换查询。',{title:'清除独立绑定？',accept:'清除绑定',danger:true}))save('tronkeys',{keys:[]})};
}

function groupForm(){const g=data.groups.find(x=>x.chat_id===selectedGroup);if(!g)return empty('找不到可管理的群组');const manageOps=g.can_manage_operators;return card(`<h2>${esc(g.title||g.chat_id)}</h2><small>${g.chat_id}</small><form id="groupForm">${input('rate','固定汇率',g.rate,'number','min="0.0001" max="1000000" step="any" required')}${input('deposit','群押金（U）',g.deposit||'0','number','min="0" max="1000000000000" step="any" required')}${input('fee_percent','费率（%）',g.fee_percent,'number','min="0" max="99.9999" step="any" required')}${select('ledger_reset_hour','日切时间（北京时间）',g.ledger_reset_hour,Array.from({length:24},(_,i)=>[i,`${String(i).padStart(2,'0')}:00`]))}${select('ledger_view_mode','账单显示',g.ledger_view_mode,[['detailed','详细模式'],['compact','简洁模式']])}${toggle('ledger_cutoff_enabled','开启日切（关闭后当前账期持续累计）',g.ledger_cutoff_enabled)}${select('currency','本群默认币种',g.currency||'CNY',[['CNY','CNY'],['U','USDT']])}<p class="muted">仅拥有者、内部授权操作人员和本群操作人可记账。</p>${toggle('ledger_enabled','开启记账',g.ledger_enabled)}<p class="muted">固定汇率保存后会替代该群的实时汇率模式。关闭日切后从当前账期继续累计。重新开启日切后从下一次日切恢复切换，历史流水和金额不重算。</p>${saveButton()}</form>`)+card(`<h2>群操作人</h2>${g.operators.length?g.operators.map(o=>`<div class="record"><b>${esc(o.display_name||o.username||o.user_id)}</b><small>ID ${o.user_id}</small>${manageOps?`<div class="actions"><button class="danger" data-remove-op="${o.user_id}">移除群操作人</button></div>`:''}</div>`).join(''):empty('还没有群操作人')}${manageOps?`<form id="operatorForm">${input('op_id','Telegram 用户 ID','','text','inputmode="numeric" pattern="[0-9]+" required')}${input('op_name','姓名或备注','','text','maxlength="100"')}<div class="actions"><button type="submit">添加群操作人</button></div></form>`:'<p class="muted">只有所有者或群绑定者可管理群操作人。</p>'}`)}
function shopForm(){let c=data.shop;return card(`<h2>商城配置</h2><p class="muted">更换收款地址会重建扫描基线，历史转账不会计为新订单。</p><form id="shopForm">${toggle('enabled','启用商城',c.enabled)}${input('trx_own','TRX 收款地址',c.trx_own,'text','maxlength="34"')}${input('price','每单位售价（TRX）',c.price,'number','min="0.000001" step="any" required')}${input('energy','每单位能量',c.energy,'number','min="1" step="1" required')}<div class="grid"><div>${input('min_units','最小倍数',c.min_units,'number','min="1" max="1000" required')}</div><div>${input('max','最大倍数',c.max,'number','min="1" max="1000" required')}</div></div>${select('provider','能量上游',c.provider,data.providers.map(p=>[p.value,p.label]))}${input('provider_key',data.secrets_set.provider_key?'上游 Key（已配置；留空保留）':'上游 Key','','password','autocomplete="new-password"')}${input('contact','客服联系方式',c.contact)}${input('group_ids','订单通知群 ID（逗号分隔）',c.group_ids)}<label for="notice">客户转账说明</label><textarea id="notice" name="notice" maxlength="2000">${esc(c.notice)}</textarea><details><summary>自定义上游接口</summary>${input('custom_url','接口 URL',c.custom_url)}${select('custom_method','请求方式',c.custom_method,[['GET','GET'],['POST','POST']])}${input('custom_ok_path','成功字段路径',c.custom_ok_path)}${input('custom_ok_value','成功值',c.custom_ok_value)}${input('custom_order_path','订单号字段路径',c.custom_order_path)}<small>沿用现有占位符：{key}、{addr}、{energy}、{hours}。</small></details><h3>Telegram 会员</h3>${toggle('premium_enabled','启用会员商品',c.premium_enabled)}${input('premium_key',data.secrets_set.premium_key?'会员 Key（已配置；留空保留）':'会员 Key','','password','autocomplete="new-password"')}${[3,6,12].map(m=>input('premium_'+m,`${m}个月售价（USDT）`,c.premium_prices[m],'number','min="0.000001" step="any" required')).join('')}<h3>笔数套餐</h3>${toggle('auto_enabled','启用笔数套餐',c.auto_enabled)}${select('auto_type','笔数类型',c.auto_type,[[0,'0'],[1,'1'],[2,'2'],[3,'3']])}<label for="auto_prices">套餐售价（JSON：笔数对应 TRX 价格）</label><textarea id="auto_prices" name="auto_prices">${esc(JSON.stringify(c.auto_prices,null,2))}</textarea><small>例如 {"10": 35, "20": 65}。上游能力和既有商品参数仍需正确配置。</small>${saveButton()}</form>`)}

 else body=card(`<h2>${names[next]}</h2><p class="muted">${next==='ads'?'按每天、单次定时或固定间隔向指定群推送文字和图片。':'根据关键词，按精确、包含或前缀匹配自动回复。'}</p><form>${next==='ads'?select('preview_mode','推送方式','daily',[['daily','每天定时'],['once','单次定时'],['interval','循环推送']])+input('preview_at','发送时间','09:00','time'):input('preview_keyword','关键词','你好')+select('preview_match','匹配方式','contains',[['exact','精确匹配'],['contains','包含匹配'],['prefix','前缀匹配']])}<label>消息内容</label><textarea aria-label="消息内容">${next==='ads'?'在指定时间发送群消息。':'欢迎使用机器人。'}</textarea><button type="submit">保存规则</button></form>`);

function showEditor(title,body){const d=$('#editor');d.innerHTML=`<div class="sheet-heading"><h2 id="editorTitle">${esc(title)}</h2><button type="button" class="quiet" id="closeEditor">取消</button></div>${body}`;editorDirty=false;d.showModal();editorFormState=formState(d);closingState();$('#closeEditor').onclick=closeEditor;d.onclose=()=>{editorDirty=false;closingState()};d.oncancel=e=>{e.preventDefault();closeEditor()};const changed=()=>{editorDirty=formState(d)!==editorFormState;closingState()};d.oninput=changed;d.onchange=changed;d.onclick=e=>{if(e.target===d){const r=d.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top)closeEditor()}}}

function openWelcomePhoto(){
 showEditor('欢迎图片',`<form id="welcomePhotoForm"><p class="muted" id="photoStatus">${data.welcome_photo_exists?'正在读取当前图片…':'未设置欢迎图片'}</p><img id="welcomePhotoPreview" class="welcome-preview" alt="欢迎图片预览" hidden><input type="file" id="welcome_file" name="welcome_file" accept="image/jpeg,image/png,image/webp" hidden><p class="muted">支持 JPG、PNG、WebP，最大6MB。更改图片不会修改欢迎文案。</p><div class="actions"><button type="button" class="quiet" id="chooseWelcomePhoto">选择图片</button><button type="button" class="danger" id="removeWelcomePhoto" ${data.welcome_photo_exists?'':'hidden'}>移除图片</button></div><button type="submit" id="saveWelcomePhoto" class="wide" disabled>保存图片</button></form>`);

function selectedTargets(form,name){return [...form.querySelectorAll(`input[name="${name}"]:checked`)].map(el=>Number(el.value))}
function openStaff(id){const u=data.permission_users?.find(u=>u.user_id===id),s=data.staff.find(s=>s.id===id)||(u?{id:u.user_id,name:u.name,grants:{...u.grants,groups:u.group_ids}}:null),p=s?.grants||{manage:false,global_ops:false,broadcast:false,groups:[]};showEditor(s?'编辑内部人员':'添加内部人员',`<form id="grantForm">${input('staff_id','Telegram ID',s?.id||'','text',`inputmode="numeric" pattern="[0-9]+" required ${s?'readonly':''}`)}${input('staff_name','用户名／备注（可选）',s?.name||'','text','maxlength="100"')}<p class="grant-note">权限可组合授予；仅拥有者可修改授权。</p><div class="grant-grid"><div>${toggle('manage','管理权限',p.manage)}<small>管理小程序配置、定时广告和自动回复。</small></div><div>${toggle('global_ops','全局操作',p.global_ops)}<small>可在所有群记账与操作。</small></div><div>${toggle('single_ops','单群操作',p.groups.length>0)}<small>仅在下方指定群记账与操作。</small></div><div>${toggle('broadcast','广播',p.broadcast)}<small>额外授予群广播与广告配置权限。</small></div></div>${targets('staff_groups',p.groups)}<button class="wide" type="submit">确认授权</button></form>`);$('#grantForm').onsubmit=e=>{e.preventDefault();const f=e.target,groups=f.single_ops.checked?selectedTargets(f,'staff_groups'):[];if(f.single_ops.checked&&!groups.length)return toast('请选择单群操作的授权群组');save('staff',{user_id:f.staff_id.value,name:f.staff_name.value,add:true,grants:{manage:f.manage.checked,global_ops:f.global_ops.checked,broadcast:f.broadcast.checked,groups}})}}
function openRule(id){const section=view,r=(data.customer[section]||[]).find(x=>x.id===id)||{id:'',title:'',keyword:'',match:'contains',content:'',groups:[],enabled:true,mode:'daily',at:'09:00',interval:60};let fields=section==='replies'?input('keyword','关键词',r.keyword,'text','required maxlength="100" placeholder="多个关键词用空格分隔，例如：你好 欢迎 帮助"')+select('match','匹配方式',r.match,[['exact','精确匹配'],['contains','包含匹配'],['prefix','前缀匹配']]):select('mode','推送方式',r.mode,[['daily','每天定时'],['interval','按分钟循环'],['once','单次定时']])+`<div id="dailyAt">${input('daily_at','每天时间（北京时间）',r.mode==='daily'?r.at:'09:00','time')}</div><div id="onceAt">${input('once_at','推送时间（北京时间）',r.mode==='once'?r.at.slice(0,16):'','datetime-local')}</div><div id="intervalAt">${input('interval','循环间隔（分钟）',r.interval,'number','min="1" max="10080" step="1"')}</div>`;showEditor((id?'编辑':'新增')+(section==='ads'?'定时广告':'自动回复'),`<form id="ruleForm">${input('rule_title','标题',r.title,'text','maxlength="100"')}${fields}<label for="rule_content">${section==='ads'?'广告内容':'回复内容'}</label><textarea id="rule_content" name="rule_content" maxlength="1500" required>${esc(r.content)}</textarea>${section==='ads'?`<h3>广告图片（可选）</h3><img id="adPhotoPreview" class="welcome-preview" alt="广告图片预览" hidden><input type="hidden" name="ad_image" value="${esc(r.image||'')}"><input type="file" name="ad_file" id="ad_file" accept="image/jpeg,image/png,image/webp" hidden><p class="muted" id="adPhotoStatus">支持 JPG、PNG、WebP，最大6MB。</p><div class="actions"><button type="button" class="quiet" id="chooseAdPhoto">选择图片</button><button type="button" class="danger" id="removeAdPhoto" ${r.image?'':'hidden'}>移除图片</button></div>`:''}${targets('rule_groups',r.groups)}${toggle('enabled','启用规则',r.enabled)}<p class="muted">${section==='ads'?'支持文字和图片。':'纯文本发送。'}规则创建者被撤销管理／广播权限后停止执行。</p><button class="wide" type="submit">保存规则</button></form>`);const f=$('#ruleForm');if(section==='ads'){bindAdPhoto(f);const mode=()=>{for(const [node,v] of [['dailyAt','daily'],['onceAt','once'],['intervalAt','interval']]){$('#'+node).hidden=f.mode.value!==v;$('#'+node).querySelector('input').required=f.mode.value===v}};f.mode.onchange=mode;mode()}f.onsubmit=e=>{e.preventDefault();const groups=selectedTargets(f,'rule_groups');if(!groups.length)return toast('请选择目标群组');const rule={...r,title:f.rule_title.value,content:f.rule_content.value,groups,enabled:f.enabled.checked};if(section==='replies'){rule.keyword=f.keyword.value;rule.match=f.match.value}else{rule.image=f.ad_image.value;rule.mode=f.mode.value;rule.at=rule.mode==='once'?f.once_at.value+':00+08:00':f.daily_at.value;rule.interval=Number(f.interval.value||60)}const list=[...(data.customer[section]||[])];const index=list.findIndex(x=>x.id===id);if(index<0)list.push(rule);else list[index]=rule;saveCustomer(section,list)}}
function bindAdPhoto(f){
 const d=$('#editor'),preview=d.querySelector('#adPhotoPreview'),status=d.querySelector('#adPhotoStatus');let uploadSequence=0;
 const show=image=>{preview.src=image;preview.hidden=false};const changed=()=>{f.rule_content.required=!f.ad_image.value;$('#removeAdPhoto').hidden=!f.ad_image.value;editorDirty=formState(d)!==editorFormState;closingState()};f.rule_content.required=!f.ad_image.value;
 if(f.ad_image.value)api('adphoto',{mode:'preview',ref:f.ad_image.value}).then(r=>{if(d.open&&d.querySelector('#ruleForm')===f&&!uploadSequence)show(r.image)}).catch(e=>{if(d.querySelector('#ruleForm')===f)status.textContent=e.message});
 $('#chooseAdPhoto').onclick=()=>f.ad_file.click();$('#removeAdPhoto').onclick=()=>{uploadSequence++;f.ad_image.value='';f.ad_file.value='';preview.hidden=true;changed()};
 f.ad_file.onchange=async()=>{const file=f.ad_file.files[0];if(!file)return;const sequence=++uploadSequence,submit=f.querySelector('button[type=submit]');if(file.size>6*1024*1024||!['image/jpeg','image/png','image/webp'].includes(file.type))return toast('请选择6MB以内的JPG、PNG或WebP图片');submit.disabled=true;status.textContent='正在上传图片…';try{const image=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(file)});const result=await api('adphoto',{mode:'upload',image});if(sequence!==uploadSequence||!d.open||d.querySelector('#ruleForm')!==f)return;f.ad_image.value=result.ref;show(image);status.textContent='图片已选择，保存规则后生效';changed()}catch(e){status.textContent=e.message||'图片上传失败，请重试'}finally{if(sequence===uploadSequence)submit.disabled=false}};

function billDetail(){const b=billData?.bills.find(b=>billKey(b)===selectedBill);if(!b)return empty('该账期已无匹配流水，请返回选择其他账期');return card(`<h2>${esc(b.title)}</h2><small>账期 ${esc(periodLabel(b.period))}</small>`)+summaryCards(b.summary)+card(`<h2>流水明细 · ${b.entries.length}</h2>${entryRecords(b.entries)}`)+`<button class="quiet wide" data-back>返回账期列表</button>`}
function groupStatistics(){if(!statDetail)return empty('统计已刷新，请返回重新查询');const g=statDetail.groups[0];return card(`<h2>${esc(g?.title||g?.chat_id||'群组统计')}</h2><small>${esc(statDetail.start)} 至 ${esc(statDetail.end)} · 北京时间自然日</small>`)+summaryCards(statDetail.summary)+card(`<h2>流水明细 · ${statDetail.entries.length}</h2>${entryRecords(statDetail.entries)||empty('所选日期范围暂无流水。')}`)+'<button class="quiet wide" data-back>返回统计</button>'}
async function openGroupStatistics(button){if(busy||queryBusy)return;const sequence=++querySequence;queryBusy=true;button.disabled=true;button.setAttribute('aria-busy','true');try{const result=await api('statistics',{chat_id:button.dataset.statsGroup,sort:statsSort,...statsRange});if(sequence!==querySequence||view!=='stats')return;statDetail=result;await go('statgroup')}catch(e){if(sequence===querySequence)toast(e.message)}finally{if(sequence===querySequence)queryBusy=false;button.disabled=false;button.removeAttribute('aria-busy')}}
function stats(){if(data.type==='shop')return shopStats();statsRange??={start:data.today,end:data.today};const groups=statData?.groups||[];return `<div class="stats-controls"><small>排序指标</small><div class="pills sort-pills">${[['income','总入款'],['payable','应下发'],['paid','已下发'],['balance','未下发']].map(([key,label])=>`<button data-sort="${key}" class="${statsSort===key?'':'quiet'}">${label}</button>`).join('')}</div><div class="stats-scope">${select('stats_group','统计范围',statsGroup,groupOptions())}</div><button id="statsQuery" class="wide quiet query-button">查询</button><div class="date-range"><input type="date" id="stats_start" aria-label="统计开始日期" min="${data.month}" max="${data.today}" value="${statsRange.start}"><span>至</span><input type="date" id="stats_end" aria-label="统计结束日期" min="${data.month}" max="${data.today}" value="${statsRange.end}"></div><div class="pills period-pills">${[['today','今天'],['yesterday','昨天'],['week','本周'],['month','本月']].map(([key,label])=>`<button class="quiet" data-period="${key}">${label}</button>`).join('')}</div></div>`+summaryCards(statData?.summary)+card(`<div class="group-stats-heading"><strong>群组统计</strong><small>共 ${groups.length} 个群组</small></div>${groups.length?groups.map(g=>`<button class="row" data-stats-group="${g.chat_id}"><span><strong>${esc(g.title||g.chat_id)}</strong><small>${g.count} 笔 · 入款 ${esc(g.income)} · 应下发 ${esc(g.payable)}U<br>已下发 ${esc(g.paid)}U · 未下发 ${esc(g.balance)}U</small></span></button>`).join(''):'<div class="stats-empty muted">所选范围暂无可统计的群组。</div>'}<details><summary>统计口径</summary><small>北京时间 · 本月自然日；清空计入，撤销不计，结转不重复计入。</small></details>`)}
function cancelQuery(){queryController?.abort();queryController=null;pendingQuery='';querySequence++;queryBusy=false}
async function queryRecords(kind){
 if(busy)return;
 const payload=kind==='bills'?{chat_id:billGroup,kind:filterKind,search:billSearch}:{chat_id:statsGroup,sort:statsSort,...statsRange};
 const key=JSON.stringify([kind,payload]);if(queryBusy&&pendingQuery===key)return;
 cancelQuery();const sequence=querySequence,controller=queryController=new AbortController();pendingQuery=key;queryBusy=true;
 const button=$(kind==='bills'?'#billQuery':'#statsQuery');if(button){button.disabled=true;button.textContent='查询中…'}
 try{const result=await api(kind==='bills'?'bills':'statistics',payload,controller.signal);if(sequence!==querySequence)return;if(kind==='bills')billData=result;else statData=result;queryBusy=false;if(view===kind)render()}
 catch(e){if(sequence===querySequence&&e.name!=='AbortError')toast(e.message)}
 finally{if(sequence===querySequence){queryController=null;pendingQuery='';queryBusy=false;const current=$(kind==='bills'?'#billQuery':'#statsQuery');if(current){current.disabled=false;current.textContent=kind==='bills'?'搜索':'查询'}}}
}
function bindRecords(){
 document.querySelectorAll('[data-user]').forEach(b=>b.onclick=()=>go('user',{user:Number(b.dataset.user)}));
 if($('#editUserGrants'))$('#editUserGrants').onclick=()=>openStaff(selectedUser);
 const f=$('#pricingForm');if(f){const u=data.permission_users.find(u=>u.user_id===selectedUser);let previousChat=f.pricing_chat.value;const fill=()=>{const row=u.pricing?.find(p=>p.chat_id===Number(f.pricing_chat.value));f.personal_rate.value=row?.rate||'';f.personal_fee.value=row?.fee_percent||''};fill();f.pricing_chat.onchange=async()=>{const next=f.pricing_chat.value;if(dirty&&!await confirmAction('当前个人参数尚未保存，切换群组后将丢失。',{title:'切换群组？',accept:'放弃修改',danger:true})){f.pricing_chat.value=previousChat;return}fill();previousChat=next;pageFormState=formState($('#content'));dirty=false;closingState()};f.onsubmit=e=>{e.preventDefault();save('pricing',{chat_id:f.pricing_chat.value,user_id:selectedUser,settings:{rate:f.personal_rate.value,fee_percent:f.personal_fee.value}})}};
 document.querySelectorAll('[data-bill-group]').forEach(b=>b.onclick=()=>go('billgroup',{billGroup:Number(b.dataset.billGroup)}));
 document.querySelectorAll('[data-bill]').forEach(b=>b.onclick=()=>go('bill',{bill:b.dataset.bill}));
 if(view==='bills'&&data.type==='ledger'){const query=()=>{billGroup=$('#bill_group').value;billSearch=$('#bill_search').value;queryRecords('bills')};$('#billQuery').onclick=query;$('#bill_group').onchange=query;$('#bill_search').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();query()}};document.querySelectorAll('[data-bill-kind]').forEach(b=>b.onclick=()=>{filterKind=b.dataset.billKind;query()});if(!billData&&!queryBusy&&!busy)query()}
 if(view==='stats'&&data.type==='ledger'){const query=()=>{statsGroup=$('#stats_group').value;statsRange={start:$('#stats_start').value,end:$('#stats_end').value};queryRecords('stats')};$('#statsQuery').onclick=query;$('#stats_group').onchange=query;['stats_start','stats_end'].forEach(id=>$('#'+id).onchange=query);document.querySelectorAll('[data-sort]').forEach(b=>b.onclick=()=>{statsSort=b.dataset.sort;query()});document.querySelectorAll('[data-period]').forEach(b=>b.onclick=()=>{const now=new Date(data.today+'T12:00:00Z'),start=new Date(now);if(b.dataset.period==='yesterday')start.setUTCDate(start.getUTCDate()-1);if(b.dataset.period==='week')start.setUTCDate(start.getUTCDate()-((start.getUTCDay()+6)%7));if(b.dataset.period==='month')start.setUTCDate(1);let from=start.toISOString().slice(0,10),to=b.dataset.period==='yesterday'?from:data.today;if(from<data.month){from=data.month;if(to<data.month)to=data.month}$('#stats_start').value=from;$('#stats_end').value=to;query()});document.querySelectorAll('[data-stats-group]').forEach(b=>b.onclick=()=>openGroupStatistics(b));if(!statData&&!queryBusy&&!busy)query()}
}
function render(){
 rendering=true;try{
 $('#title').textContent=names[view];$('#back').hidden=view==='overview';closingState();
 const pages={user:userForm,bill:billDetail,billgroup:groupBills,statgroup:groupStatistics,overview,users:userList,groups:groupList,bills,stats,staff:staffPage,shop:shopForm,group:groupForm,help,basics,features,ads:rulesPage,replies:rulesPage,tron};
 const preview=['basics','features','staff','ads','replies'].includes(view)&&!configEditable(view);
 $('#content').innerHTML=preview?configurationPreview(view):pages[view]();$('#nav').hidden=false;
 if(preview)$('#content').querySelectorAll('input,select,textarea,button:not([data-back])').forEach(el=>el.disabled=true);
 updateRemaining();
 $('#nav').style.gridTemplateColumns=`repeat(${navViews().length},minmax(0,1fr))`;$('#nav').innerHTML=navViews().map(v=>`<button data-go="${v}" ${v===({user:'users',group:'groups',bill:'bills',billgroup:'bills',statgroup:'stats'}[view]||(['overview','users','groups','bills','stats'].includes(view)?view:'overview'))?'aria-current="page"':''}><span aria-hidden="true">${icons[v]}</span>${names[v]==='配置中心'?'概览':names[v]}</button>`).join('');
 renderFooter();
 document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));
 document.querySelectorAll('[data-back]').forEach(b=>b.onclick=goBack);
 document.querySelectorAll('[data-group]').forEach(b=>b.onclick=()=>go('group',{group:Number(b.dataset.group)}));

 const searchBox=$('#search');if(searchBox){searchBox.value=listSearch[view]||'';const run=()=>{listSearch[view]=searchBox.value;document.querySelectorAll('[data-search]').forEach(el=>el.hidden=!el.dataset.search.toLowerCase().includes(searchBox.value.trim().toLowerCase()))};searchBox.oninput=run;$('#searchBtn').onclick=run;searchBox.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();run();searchBox.blur()}};run()}
 $('#content').querySelectorAll('form').forEach(f=>{const changed=()=>{if(rendering||!f.isConnected||f.id==='tronQueryForm')return;dirty=formState($('#content'))!==pageFormState;closingState()};f.oninput=changed;f.onchange=changed});
 bindTron();
 if(!preview)bindCustomer();bindRecords();pageFormState=formState($('#content'));

 if($('#staffForm'))$('#staffForm').onsubmit=e=>{e.preventDefault();save('staff',{user_id:e.target.user_id.value,name:e.target.elements.namedItem('name').value,add:true})};
 document.querySelectorAll('[data-remove-staff]').forEach(b=>b.onclick=async()=>{if(await confirmAction('移除该人员的面板授权；群内单独授权继续按群设置生效。',{title:'移除人员授权？',accept:'移除',danger:true}))save('staff',{user_id:b.dataset.removeStaff,add:false})});
 if($('#groupForm'))$('#groupForm').onsubmit=e=>{e.preventDefault();const f=e.target;save('group',{chat_id:selectedGroup,settings:{currency:f.currency.value,...(f.all_members_can_record?{all_members_can_record:f.all_members_can_record.checked}:{}),rate:f.rate.value,deposit:f.deposit.value,fee_percent:f.fee_percent.value,ledger_enabled:f.ledger_enabled.checked,ledger_reset_hour:f.ledger_reset_hour.value,ledger_cutoff_enabled:f.ledger_cutoff_enabled.checked,ledger_view_mode:f.ledger_view_mode.value}})};
 if($('#operatorForm'))$('#operatorForm').onsubmit=e=>{e.preventDefault();save('operator',{chat_id:selectedGroup,user_id:e.target.op_id.value,name:e.target.op_name.value,add:true})};
 document.querySelectorAll('[data-remove-op]').forEach(b=>b.onclick=async()=>{if(await confirmAction('该人员将失去此群的单独记账授权。',{title:'移除群操作人？',accept:'移除',danger:true}))save('operator',{chat_id:selectedGroup,user_id:b.dataset.removeOp,add:false})});
 if($('#shopForm'))$('#shopForm').onsubmit=e=>{e.preventDefault();try{const f=e.target,p={};new FormData(f).forEach((v,k)=>p[k]=v);['enabled','premium_enabled','auto_enabled'].forEach(k=>p[k]=f[k].checked);p.premium_prices={};[3,6,12].forEach(m=>{p.premium_prices[m]=p['premium_'+m];delete p['premium_'+m]});p.auto_prices=JSON.parse(p.auto_prices);save('shop',p)}catch{toast('笔数套餐 JSON 格式不正确')}};
 }finally{rendering=false;closingState()}
}
async function refreshData(){
 const cid=statDetail?.groups[0]?.chat_id;
 const next=await api('overview'),target=viewAllowed(view,next)?view:'overview';let nextBills=null,nextStats=null,nextDetail=null,range=statsRange;
 if(next.type==='ledger'){
  if(range)range={start:range.start<next.month?next.month:range.start,end:range.end<next.month?next.month:range.end};
  if(['bills','billgroup','bill'].includes(target))nextBills=await api('bills',{chat_id:billGroup,kind:filterKind,search:billSearch});
  if(target==='stats')nextStats=await api('statistics',{chat_id:statsGroup,sort:statsSort,...range});
  if(target==='statgroup'&&cid)nextDetail=await api('statistics',{chat_id:cid,sort:statsSort,...range});
 }
 if(target!==view){view=target;trail.length=0}data=next;receivedAt=performance.now();billData=nextBills;statData=nextStats;statDetail=nextDetail;statsRange=range;
}
async function load({notify=false}={}){
 if(busy){if(notify)toast('正在处理，请稍候');return}if(!await canLeave())return;cancelQuery();busy=true;const scroll=scrollY;$('#refresh').disabled=true;$('#refresh').textContent='…';$('#content').setAttribute('aria-busy','true');
 try{await refreshData();dirty=false;render();requestAnimationFrame(()=>window.scrollTo(0,scroll));if(notify)toast('已刷新')}
 catch(e){if(data)toast('刷新失败：'+e.message);else{$('#content').innerHTML=card(`<h2>暂时无法进入</h2><p>${esc(e.message)}</p><p class="muted">请从机器人底部「配置中心」重新打开；首次使用需先激活。</p>`,'error');$('#nav').hidden=true}}
 finally{busy=false;$('#refresh').disabled=false;$('#refresh').textContent='↻';$('#content').removeAttribute('aria-busy');closingState()}
}
async function save(action,payload){if(busy)return;cancelQuery();const draft=($('#editor').open||action==='customer'&&payload.section==='addresses')&&dirty?formState($('#content')):null;busy=true;const buttons=[...document.querySelectorAll('button')].map(b=>[b,b.disabled]);buttons.forEach(([b])=>b.disabled=true);const submit=document.activeElement,submitText=submit?.textContent;if(submit?.tagName==='BUTTON'&&submit.type==='submit')submit.textContent='保存中…';$('#content').setAttribute('aria-busy','true');let saved=false;try{const result=await api(action,payload);saved=true;editorDirty=false;if(!draft)dirty=false;if($('#editor').open)$('#editor').close();await refreshData();render();if(draft){JSON.parse(draft).forEach((fields,i)=>{const f=$('#content').querySelectorAll('form:not(#tronQueryForm)')[i];fields.forEach(([name,value])=>{const e=f?.elements.namedItem(name);if(e){if(e.type==='checkbox')e.checked=value;else e.value=value}})});dirty=true}toast(result.baseline_reset?'已保存，收款地址扫描基线已重置':'配置已保存')}catch(e){toast((saved?'已保存，刷新失败：':'')+e.message)}finally{busy=false;buttons.forEach(([b,disabled])=>{if(b.isConnected)b.disabled=disabled});if(submit?.isConnected&&submit.type==='submit')submit.textContent=submitText;$('#content').removeAttribute('aria-busy');closingState()}}
setInterval(updateRemaining,1000);
$('#back').onclick=goBack;$('#refresh').onclick=()=>load({notify:true});
tg?.BackButton?.onClick(goBack);
if(!tg?.initData){$('#content').innerHTML=card('<h2>请在 Telegram 中打开</h2><p>私聊自己的机器人，发送 /admin 激活码后，点击底部「配置中心」。</p><small>外部浏览器没有 Telegram 登录信息，无法配置机器人。</small>','error')}else load();
</script>
